name: Weekly data refresh

on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh GitHub metadata snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用带 token 的请求拉最新 star / pushed_at（未认证时脚本会退化为 10 次/分钟）
          node scripts/build-data.mjs --fetch
      - name: Self-check
        run: node scripts/check.mjs && node scripts/smoke.mjs
      - name: Open PR if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(data): 每周自动刷新 star / 活跃度快照'
          title: 'chore(data): 每周自动刷新 star / 活跃度快照'
          body: |
            自动刷新 `data/cache.json` 与 `data/skills.json`，并重新内嵌进 `index.html`。
            请抽查几条 star 变化是否合理，然后合并。
          branch: chore/weekly-data-refresh
          delete-branch: true
