<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="CAD Skills 图鉴">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e11"/>
      <stop offset="1" stop-color="#101a20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0" r="0.9">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.92" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b2329" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- 品牌 -->
  <g transform="translate(80, 86)">
    <rect x="0" y="0" width="46" height="46" rx="12" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M9 33 23 12l14 21" fill="none" stroke="#5eead4" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M16 28h14" stroke="#5eead4" stroke-width="3.2" stroke-linecap="round"/>
    <text x="62" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" fill="#e6edf3">cad-skills-web</text>
    <text x="62" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6b7885">GitHub · CC BY 4.0</text>
  </g>

  <!-- 主标题 -->
  <text x="80" y="286" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="66" font-weight="700" fill="#e6edf3">CAD Skills 图鉴</text>
  <text x="80" y="348" font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="30" fill="#9aa7b2">把 CAD 交给 Agent 之前，先挑对那条路线</text>

  <!-- 三个事实条 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(80, 408)">
      <rect width="300" height="104" rx="14" fill="#141a1f" stroke="#232c33"/>
      <text x="24" y="44" font-size="34" font-weight="700" fill="#5eead4">66</text>
      <text x="24" y="76" font-size="14" fill="#6b7885">个 skill / MCP server</text>
    </g>
    <g transform="translate(404, 408)">
      <rect width="300" height="104" rx="14" fill="#141a1f" stroke="#232c33"/>
      <text x="24" y="44" font-size="34" font-weight="700" fill="#e6edf3">50k+</text>
      <text x="24" y="76" font-size="14" fill="#6b7885">合计 star</text>
    </g>
    <g transform="translate(728, 408)">
      <rect width="300" height="104" rx="14" fill="#141a1f" stroke="#232c33"/>
      <text x="24" y="44" font-size="34" font-weight="700" fill="#a78bfa">16</text>
      <text x="24" y="76" font-size="14" fill="#6b7885">套宿主接入配方</text>
    </g>
  </g>

  <!-- 底部标签 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <rect x="80" y="546" width="128" height="34" rx="17" fill="#0e1216" stroke="#5eead4" stroke-opacity="0.4"/>
    <text x="102" y="568" fill="#5eead4">MCP server</text>
    <rect x="220" y="546" width="96" height="34" rx="17" fill="#0e1216" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="242" y="568" fill="#a78bfa">SKILL.md</text>
    <rect x="328" y="546" width="184" height="34" rx="17" fill="#0e1216" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="350" y="568" fill="#38bdf8">FreeCAD / KiCad</text>
    <text x="1120" y="568" fill="#4b5763" text-anchor="end">一页挑对</text>
  </g>
</svg>
